<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes" />
    <title>SekolahMu</title>
    <script type="importmap">
        {
            "imports": {
                "firebase/app": "https://www.gstatic.com/firebasejs/12.17.0/firebase-app.js",
                "firebase/auth": "https://www.gstatic.com/firebasejs/12.17.0/firebase-auth.js",
                "firebase/database": "https://www.gstatic.com/firebasejs/12.17.0/firebase-database.js"
            }
        }
    </script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg-primary: #0f0e1a;
            --bg-secondary: #1a1833;
            --bg-card: rgba(26, 24, 51, 0.8);
            --bg-input: rgba(255, 255, 255, 0.05);
            --border-color: rgba(255, 255, 255, 0.08);
            --text-primary: #e8e4f0;
            --text-secondary: #a8a4b8;
            --text-muted: #6a6678;
            --shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
            --gradient: linear-gradient(135deg, #0f0e1a 0%, #1a1833 50%, #2d1b4e 100%);
            --card-hover: rgba(255, 255, 255, 0.04);
        }

        [data-theme="light"] {
            --bg-primary: #f0edf5;
            --bg-secondary: #e8e4f0;
            --bg-card: rgba(255, 255, 255, 0.85);
            --bg-input: rgba(0, 0, 0, 0.04);
            --border-color: rgba(0, 0, 0, 0.08);
            --text-primary: #1a1833;
            --text-secondary: #4a4660;
            --text-muted: #8a86a0;
            --shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
            --gradient: linear-gradient(135deg, #f0edf5 0%, #e8e4f0 50%, #ddd6ea 100%);
            --card-hover: rgba(0, 0, 0, 0.03);
        }

        body {
            font-family: system-ui, -apple-system, 'Segoe UI', sans-serif;
            background: var(--gradient);
            color: var(--text-primary);
            min-height: 100vh;
            padding: 16px;
            overflow-x: hidden;
            transition: background 0.4s ease, color 0.3s ease;
        }

        .container {
            max-width: 820px;
            margin: 0 auto;
        }

        /* ===== NAVBAR ===== */
        .nav {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
            background: var(--bg-card);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            padding: 10px 16px;
            border-radius: 16px;
            margin-bottom: 20px;
            border: 1px solid var(--border-color);
            position: sticky;
            top: 8px;
            z-index: 50;
            align-items: center;
            justify-content: space-between;
        }
        .nav-left {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
        }
        .nav-right {
            display: flex;
            gap: 6px;
            align-items: center;
        }
        .nav button {
            background: transparent;
            color: var(--text-secondary);
            border: none;
            padding: 8px 14px;
            border-radius: 10px;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.25s ease;
            position: relative;
        }
        .nav button::after {
            content: '';
            position: absolute;
            bottom: 2px;
            left: 50%;
            transform: translateX(-50%) scaleX(0);
            width: 60%;
            height: 2px;
            background: #d0bcff;
            border-radius: 4px;
            transition: transform 0.3s cubic-bezier(0.2, 0.9, 0.3, 1.1);
        }
        .nav button:hover {
            background: var(--card-hover);
            color: var(--text-primary);
        }
        .nav button.active {
            color: #d0bcff;
        }
        .nav button.active::after {
            transform: translateX(-50%) scaleX(1);
        }
        .nav button:active {
            transform: scale(0.94);
        }

        .theme-toggle {
            background: var(--bg-input);
            border: 1px solid var(--border-color);
            color: var(--text-primary);
            padding: 6px 12px;
            border-radius: 10px;
            cursor: pointer;
            font-size: 16px;
            transition: all 0.2s;
        }
        .theme-toggle:hover {
            background: var(--card-hover);
        }

        .user-badge {
            font-size: 13px;
            color: var(--text-secondary);
            padding: 6px 12px;
            background: var(--bg-input);
            border-radius: 10px;
            border: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .user-badge .logout-btn {
            background: none;
            border: none;
            color: #f2b8b5;
            cursor: pointer;
            font-size: 13px;
            padding: 0 4px;
        }
        .user-badge .logout-btn:hover {
            color: #ff6b6b;
        }

        /* ===== PAGES ===== */
        .page {
            display: none;
            animation: pageFadeIn 0.45s cubic-bezier(0.2, 0.9, 0.3, 1.1) forwards;
        }
        .page.active {
            display: block;
        }

        @keyframes pageFadeIn {
            from {
                opacity: 0;
                transform: translateY(24px) scale(0.98);
            }
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        /* ===== CARDS ===== */
        .card {
            background: var(--bg-card);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--border-color);
            border-radius: 20px;
            padding: 22px 24px;
            margin-bottom: 16px;
            transition: all 0.3s ease;
            box-shadow: var(--shadow);
        }
        .card:hover {
            border-color: rgba(255, 255, 255, 0.12);
        }

        .card-title {
            font-size: 20px;
            font-weight: 700;
            margin-bottom: 12px;
        }

        /* ===== BUTTONS ===== */
        .btn {
            border: none;
            border-radius: 14px;
            padding: 11px 24px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s cubic-bezier(0.2, 0.9, 0.3, 1.1);
            display: inline-flex;
            align-items: center;
            gap: 6px;
            text-decoration: none;
            will-change: transform;
        }
        .btn:active {
            transform: scale(0.94);
        }
        .btn-primary {
            background: #d0bcff;
            color: #381e72;
            box-shadow: 0 4px 20px rgba(208, 188, 255, 0.2);
        }
        .btn-primary:hover {
            box-shadow: 0 6px 28px rgba(208, 188, 255, 0.35);
            transform: translateY(-2px);
        }
        .btn-danger {
            background: rgba(242, 184, 181, 0.15);
            color: #f2b8b5;
            border: 1px solid rgba(242, 184, 181, 0.15);
        }
        .btn-danger:hover {
            background: rgba(242, 184, 181, 0.25);
            transform: translateY(-1px);
        }
        .btn-outline {
            background: transparent;
            color: var(--text-primary);
            border: 1px solid var(--border-color);
        }
        .btn-outline:hover {
            background: var(--card-hover);
            transform: translateY(-1px);
        }
        .btn-sm {
            padding: 5px 12px;
            font-size: 12px;
            border-radius: 10px;
        }
        .btn-block {
            width: 100%;
            justify-content: center;
        }
        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none !important;
        }

        /* ===== DOWNLOAD ===== */
        .download-box {
            background: var(--bg-input);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 20px 22px;
            margin-top: 12px;
            transition: all 0.3s;
        }
        .download-box:hover {
            border-color: rgba(255, 255, 255, 0.12);
        }
        .download-box .row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
        }
        .download-box .info .ver {
            color: var(--text-secondary);
            font-size: 14px;
        }
        .download-box .info .sz {
            color: var(--text-secondary);
            font-size: 13px;
        }

        /* ===== STARS ===== */
        .stars {
            display: flex;
            gap: 6px;
            font-size: 42px;
            cursor: pointer;
            margin: 10px 0 16px;
            user-select: none;
            justify-content: center;
            padding: 4px 0;
        }
        .stars span {
            transition: all 0.15s cubic-bezier(0.2, 0.9, 0.3, 1.2);
            color: #48454e;
            display: inline-block;
            will-change: transform;
            position: relative;
        }
        .stars span.active {
            color: #ffd700;
            transform: scale(1.1);
        }
        .stars span:hover {
            transform: scale(1.2) rotate(-6deg);
            color: #ffd700;
        }
        .stars span:active {
            transform: scale(0.85);
        }

        .stars span.bounce {
            animation: starBounce 0.45s cubic-bezier(0.2, 0.9, 0.3, 1.2) forwards;
        }

        @keyframes starBounce {
            0% {
                transform: scale(0.5) rotate(-20deg);
            }
            50% {
                transform: scale(1.4) rotate(8deg);
            }
            70% {
                transform: scale(0.9) rotate(-4deg);
            }
            100% {
                transform: scale(1.1) rotate(0);
            }
        }

        /* ===== FORM ===== */
        .form-group {
            margin-bottom: 14px;
            transition: all 0.3s ease;
        }
        .form-group label {
            display: block;
            font-size: 13px;
            font-weight: 500;
            margin-bottom: 4px;
            color: var(--text-secondary);
        }
        .form-group input,
        .form-group textarea {
            width: 100%;
            padding: 11px 14px;
            border-radius: 12px;
            border: 1px solid var(--border-color);
            background: var(--bg-input);
            color: var(--text-primary);
            font-size: 14px;
            outline: none;
            transition: all 0.3s ease;
            font-family: inherit;
        }
        .form-group input:focus,
        .form-group textarea:focus {
            border-color: #d0bcff;
            box-shadow: 0 0 0 3px rgba(208, 188, 255, 0.08);
        }
        .form-group textarea {
            resize: vertical;
            min-height: 70px;
        }

        .password-wrap {
            position: relative;
        }
        .password-wrap input {
            padding-right: 48px;
        }
        .password-toggle {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            color: var(--text-secondary);
            font-size: 20px;
            cursor: pointer;
            padding: 4px 8px;
            border-radius: 8px;
            transition: all 0.2s;
            line-height: 1;
        }
        .password-toggle:hover {
            background: var(--card-hover);
            color: var(--text-primary);
        }
        .password-toggle:active {
            transform: translateY(-50%) scale(0.9);
        }

        .name-field-wrap {
            overflow: hidden;
            transition: all 0.4s cubic-bezier(0.2, 0.9, 0.3, 1.1);
            max-height: 80px;
            opacity: 1;
            transform: translateY(0);
            margin-bottom: 14px;
        }
        .name-field-wrap.hidden {
            max-height: 0;
            opacity: 0;
            transform: translateY(-10px) scale(0.96);
            margin-bottom: 0;
            pointer-events: none;
        }
        .name-field-wrap .form-group {
            margin-bottom: 0;
        }

        .checkbox-wrap {
            display: flex;
            align-items: center;
            gap: 10px;
            cursor: pointer;
            padding: 4px 0;
            transition: all 0.2s;
            color: var(--text-secondary);
        }
        .checkbox-wrap:hover {
            color: var(--text-primary);
        }
        .checkbox-wrap input {
            width: 18px;
            height: 18px;
            accent-color: #d0bcff;
            cursor: pointer;
            transition: transform 0.2s;
        }
        .checkbox-wrap input:checked {
            transform: scale(1.1);
        }

        /* ===== REVIEW ITEMS ===== */
        .review-item {
            background: var(--bg-input);
            border: 1px solid var(--border-color);
            border-radius: 14px;
            padding: 16px 18px;
            margin-bottom: 10px;
            animation: reviewSlideIn 0.4s cubic-bezier(0.2, 0.9, 0.3, 1.1) forwards;
            transition: all 0.3s ease;
            will-change: transform, opacity;
        }
        .review-item:hover {
            border-color: rgba(255, 255, 255, 0.12);
        }

        .review-item.removing {
            animation: reviewSlideOut 0.3s cubic-bezier(0.2, 0.9, 0.3, 1.1) forwards;
        }

        @keyframes reviewSlideIn {
            from {
                opacity: 0;
                transform: translateY(-16px) scale(0.96);
            }
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        @keyframes reviewSlideOut {
            from {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
            to {
                opacity: 0;
                transform: translateY(-12px) scale(0.94);
            }
        }

        .review-item .top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 6px;
        }
        .review-item .name {
            font-weight: 600;
            font-size: 14px;
            display: flex;
            align-items: center;
            gap: 6px;
            color: var(--text-primary);
        }
        .review-item .name .badge-anon {
            font-size: 10px;
            font-weight: 500;
            background: var(--bg-input);
            color: var(--text-secondary);
            padding: 1px 10px;
            border-radius: 20px;
            border: 1px solid var(--border-color);
        }
        .review-item .stars-display {
            color: #ffd700;
            font-size: 15px;
            letter-spacing: 1px;
        }
        .review-item .msg {
            color: var(--text-secondary);
            font-size: 14px;
            margin-top: 4px;
            word-break: break-word;
            line-height: 1.5;
        }
        .review-item .meta {
            color: var(--text-muted);
            font-size: 11px;
            margin-top: 6px;
        }

        /* ===== ADMIN ===== */
        .admin-login {
            max-width: 380px;
            margin: 0 auto;
        }
        .admin-stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(100px, 1fr));
            gap: 10px;
            margin-bottom: 18px;
        }
        .admin-stats .stat {
            background: var(--bg-input);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 14px;
            text-align: center;
            transition: all 0.3s;
        }
        .admin-stats .stat:hover {
            border-color: rgba(255, 255, 255, 0.12);
            transform: translateY(-2px);
        }
        .admin-stats .stat .num {
            font-size: 26px;
            font-weight: 700;
            color: #d0bcff;
        }
        .admin-stats .stat .lbl {
            font-size: 11px;
            color: var(--text-secondary);
        }
        .admin-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            margin-bottom: 16px;
        }

        /* ===== TOAST ===== */
        .toast {
            position: fixed;
            bottom: 24px;
            left: 50%;
            transform: translateX(-50%) translateY(20px);
            background: var(--bg-card);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--border-color);
            padding: 12px 24px;
            border-radius: 14px;
            font-size: 14px;
            opacity: 0;
            pointer-events: none;
            transition: all 0.4s cubic-bezier(0.2, 0.9, 0.3, 1.1);
            z-index: 999;
            max-width: 90%;
            text-align: center;
            box-shadow: var(--shadow);
            color: var(--text-primary);
        }
        .toast.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }

        .empty {
            color: var(--text-muted);
            text-align: center;
            padding: 40px 12px;
            font-size: 15px;
        }

        /* ===== LOGIN / REGISTER ===== */
        .auth-container {
            max-width: 400px;
            margin: 0 auto;
        }
        .auth-tabs {
            display: flex;
            gap: 0;
            margin-bottom: 20px;
            border-radius: 12px;
            overflow: hidden;
            border: 1px solid var(--border-color);
        }
        .auth-tabs button {
            flex: 1;
            padding: 10px;
            border: none;
            background: var(--bg-input);
            color: var(--text-secondary);
            cursor: pointer;
            font-weight: 600;
            font-size: 14px;
            transition: all 0.3s;
        }
        .auth-tabs button.active {
            background: #d0bcff;
            color: #381e72;
        }
        .auth-tabs button:hover:not(.active) {
            background: var(--card-hover);
        }
        .auth-form {
            display: none;
        }
        .auth-form.active {
            display: block;
        }

        .verify-badge {
            display: inline-block;
            background: rgba(168, 230, 207, 0.15);
            color: #a8e6cf;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 12px;
            border: 1px solid rgba(168, 230, 207, 0.15);
        }
        .verify-badge.unverified {
            background: rgba(242, 184, 181, 0.15);
            color: #f2b8b5;
            border-color: rgba(242, 184, 181, 0.15);
        }

        /* ===== RESPONSIVE ===== */
        @media (max-width: 600px) {
            body {
                padding: 10px;
            }
            .card {
                padding: 16px 14px;
            }
            .stars {
                font-size: 32px;
                gap: 4px;
            }
            .nav {
                flex-direction: column;
                gap: 8px;
            }
            .nav-left {
                width: 100%;
                justify-content: center;
            }
            .nav-right {
                width: 100%;
                justify-content: center;
            }
            .nav button {
                font-size: 11px;
                padding: 6px 10px;
            }
            .download-box .row {
                flex-direction: column;
                align-items: stretch;
            }
            .download-box .row .btn {
                justify-content: center;
            }
            .admin-stats {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        @media (max-width: 400px) {
            .nav-left button {
                font-size: 10px;
                padding: 4px 8px;
            }
            .user-badge {
                font-size: 11px;
                padding: 4px 8px;
            }
        }
    </style>
</head>
<body>

    <div class="container">

        <!-- ===== NAVBAR ===== -->
        <nav class="nav" id="navbar">
            <div class="nav-left">
                <button class="active" data-page="home">Home</button>
                <button data-page="rating">Rating</button>
                <button data-page="reviews">Reviews</button>
                <button data-page="admin">Admin</button>
            </div>
            <div class="nav-right">
                <button class="theme-toggle" id="themeToggle" aria-label="Toggle theme">🌙</button>
                <div id="userBadge" style="display:none;" class="user-badge"></div>
            </div>
        </nav>

        <!-- ===== PAGE: HOME ===== -->
        <div id="page-home" class="page active">
            <div class="card">
                <h1 class="card-title">SekolahMu</h1>
                <p style="color:var(--text-secondary);font-size:15px;margin-bottom:16px;">Aplikasi SMM untuk Android</p>

                <div class="download-box">
                    <div class="row">
                        <div class="info">
                            <strong style="font-size:17px;">Download APK</strong>
                            <div class="ver">Versi: <span id="apkVersion">2.2.0</span></div>
                            <div class="sz">Ukuran: <span id="apkSize">3.78 MB</span></div>
                        </div>
                        <a id="downloadBtn" href="#" class="btn btn-primary">Download</a>
                    </div>
                </div>
            </div>
        </div>

        <!-- ===== PAGE: RATING ===== -->
        <div id="page-rating" class="page">
            <div class="card">
                <h2 class="card-title">Beri Penilaian</h2>
                <p style="color:var(--text-secondary);font-size:14px;margin-bottom:16px;">Bagaimana pengalaman kamu menggunakan SekolahMu?</p>

                <!-- Auth required message -->
                <div id="ratingAuthRequired" style="text-align:center;padding:20px 0;">
                    <div style="font-size:40px;margin-bottom:10px;">🔐</div>
                    <p style="color:var(--text-secondary);">Login untuk memberi penilaian</p>
                    <button id="gotoLoginBtn" class="btn btn-primary" style="margin-top:12px;">Login</button>
                </div>

                <!-- Rating form (hidden if not logged in) -->
                <div id="ratingForm" style="display:none;">
                    <div class="form-group">
                        <label>Rating</label>
                        <div class="stars" id="starSelector">
                            <span data-value="1">☆</span>
                            <span data-value="2">☆</span>
                            <span data-value="3">☆</span>
                            <span data-value="4">☆</span>
                            <span data-value="5">☆</span>
                        </div>
                    </div>

                    <div class="name-field-wrap" id="nameFieldWrap">
                        <div class="form-group">
                            <label id="nameLabel">Nama</label>
                            <input type="text" id="reviewName" placeholder="Masukkan nama kamu..." maxlength="50" />
                        </div>
                    </div>

                    <div class="form-group">
                        <label class="checkbox-wrap">
                            <input type="checkbox" id="reviewAnonymous" />
                            <span>Kirim sebagai anonim</span>
                        </label>
                    </div>

                    <div class="form-group">
                        <label>Pesan</label>
                        <textarea id="reviewMessage" placeholder="Tulis pengalaman kamu..." maxlength="500"></textarea>
                    </div>

                    <button id="submitReview" class="btn btn-primary btn-block">Kirim Review</button>
                    <div id="reviewStatus" style="margin-top:10px;font-size:14px;color:var(--text-secondary);text-align:center;"></div>
                </div>
            </div>
        </div>

        <!-- ===== PAGE: REVIEWS ===== -->
        <div id="page-reviews" class="page">
            <div class="card">
                <h2 class="card-title">Review Pengguna</h2>
                <div id="reviewsStats" style="margin-bottom:16px;"></div>
                <div id="reviewsList"></div>
            </div>
        </div>

        <!-- ===== PAGE: ADMIN ===== -->
        <div id="page-admin" class="page">
            <div class="card">
                <div id="adminContent"></div>
            </div>
        </div>

    </div>

    <!-- ===== TOAST ===== -->
    <div id="toast" class="toast"></div>

    <script type="module">
        // ============================================================
        // FIREBASE
        // ============================================================
        import { initializeApp } from "firebase/app";
        import {
            getDatabase,
            ref,
            push,
            onValue,
            remove,
            get,
            set
        } from "firebase/database";
        import {

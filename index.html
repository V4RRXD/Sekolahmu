<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes" />
    <title>SekolahMu App</title>
    <script type="importmap">
        {
            "imports": {
                "firebase/app": "https://www.gstatic.com/firebasejs/12.17.0/firebase-app.js",
                "firebase/auth": "https://www.gstatic.com/firebasejs/12.17.0/firebase-auth.js",
                "firebase/database": "https://www.gstatic.com/firebasejs/12.17.0/firebase-database.js"
            }
        }
    </script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: system-ui, -apple-system, 'Segoe UI', sans-serif;
            background: #0b0b0f;
            color: #e6e0e9;
            min-height: 100vh;
            padding: 16px;
            overflow-x: hidden;
        }

        .container {
            max-width: 820px;
            margin: 0 auto;
        }

        /* ===== NAVBAR ===== */
        .nav {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
            background: rgba(20, 18, 24, 0.85);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            padding: 10px 16px;
            border-radius: 16px;
            margin-bottom: 20px;
            border: 1px solid rgba(255, 255, 255, 0.06);
            position: sticky;
            top: 8px;
            z-index: 50;
        }
        .nav button {
            background: transparent;
            color: #cac4cf;
            border: none;
            padding: 8px 14px;
            border-radius: 10px;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.25s ease;
            flex: 1 1 auto;
            position: relative;
        }
        .nav button::after {
            content: '';
            position: absolute;
            bottom: 2px;
            left: 50%;
            transform: translateX(-50%) scaleX(0);
            width: 60%;
            height: 2px;
            background: #d0bcff;
            border-radius: 4px;
            transition: transform 0.3s cubic-bezier(0.2, 0.9, 0.3, 1.1);
        }
        .nav button:hover {
            background: rgba(255, 255, 255, 0.05);
            color: #e6e0e9;
        }
        .nav button.active {
            color: #d0bcff;
        }
        .nav button.active::after {
            transform: translateX(-50%) scaleX(1);
        }
        .nav button:active {
            transform: scale(0.94);
        }

        /* ===== PAGES ===== */
        .page {
            display: none;
            animation: pageFadeIn 0.45s cubic-bezier(0.2, 0.9, 0.3, 1.1) forwards;
        }
        .page.active {
            display: block;
        }

        @keyframes pageFadeIn {
            from {
                opacity: 0;
                transform: translateY(24px) scale(0.98);
            }
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        /* ===== CARDS ===== */
        .card {
            background: rgba(20, 18, 24, 0.75);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 20px;
            padding: 22px 24px;
            margin-bottom: 16px;
            transition: border-color 0.3s, box-shadow 0.3s;
            will-change: transform;
        }
        .card:hover {
            border-color: rgba(255, 255, 255, 0.1);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
        }

        .card-title {
            font-size: 20px;
            font-weight: 700;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        /* ===== BUTTONS ===== */
        .btn {
            border: none;
            border-radius: 14px;
            padding: 11px 24px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s cubic-bezier(0.2, 0.9, 0.3, 1.1);
            display: inline-flex;
            align-items: center;
            gap: 6px;
            text-decoration: none;
            will-change: transform;
            position: relative;
            overflow: hidden;
        }
        .btn::after {
            content: '';
            position: absolute;
            inset: 0;
            border-radius: inherit;
            background: radial-gradient(circle at var(--x, 50%) var(--y, 50%), rgba(255, 255, 255, 0.15), transparent 60%);
            opacity: 0;
            transition: opacity 0.4s;
            pointer-events: none;
        }
        .btn:hover::after {
            opacity: 1;
        }
        .btn:active {
            transform: scale(0.94);
        }
        .btn-primary {
            background: #d0bcff;
            color: #381e72;
            box-shadow: 0 4px 20px rgba(208, 188, 255, 0.2);
        }
        .btn-primary:hover {
            box-shadow: 0 6px 28px rgba(208, 188, 255, 0.35);
            transform: translateY(-2px);
        }
        .btn-danger {
            background: rgba(242, 184, 181, 0.15);
            color: #f2b8b5;
            border: 1px solid rgba(242, 184, 181, 0.15);
        }
        .btn-danger:hover {
            background: rgba(242, 184, 181, 0.25);
            transform: translateY(-1px);
        }
        .btn-outline {
            background: transparent;
            color: #e6e0e9;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .btn-outline:hover {
            background: rgba(255, 255, 255, 0.05);
            transform: translateY(-1px);
        }
        .btn-sm {
            padding: 5px 12px;
            font-size: 12px;
            border-radius: 10px;
        }
        .btn-block {
            width: 100%;
            justify-content: center;
        }
        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none !important;
        }

        /* ===== DOWNLOAD ===== */
        .download-box {
            background: rgba(29, 27, 32, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 16px;
            padding: 20px 22px;
            margin-top: 12px;
            transition: all 0.3s;
        }
        .download-box:hover {
            border-color: rgba(255, 255, 255, 0.12);
        }
        .download-box .row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
        }
        .download-box .info .ver {
            color: #cac4cf;
            font-size: 14px;
        }
        .download-box .info .sz {
            color: #cac4cf;
            font-size: 13px;
        }
        .coming {
            color: #cac4cf;
            text-align: center;
            padding: 28px 16px;
            background: rgba(29, 27, 32, 0.4);
            border-radius: 16px;
            border: 1px dashed rgba(255, 255, 255, 0.08);
            margin-top: 12px;
            transition: all 0.3s;
        }
        .coming:hover {
            border-color: rgba(255, 255, 255, 0.12);
        }
        .coming .icon {
            font-size: 36px;
            margin-bottom: 6px;
            display: block;
            animation: float 3s ease-in-out infinite;
        }

        @keyframes float {
            0%,
            100% {
                transform: translateY(0);
            }
            50% {
                transform: translateY(-6px);
            }
        }

        /* ===== STARS ===== */
        .stars {
            display: flex;
            gap: 6px;
            font-size: 42px;
            cursor: pointer;
            margin: 10px 0 16px;
            user-select: none;
            justify-content: center;
            padding: 4px 0;
        }
        .stars span {
            transition: all 0.15s cubic-bezier(0.2, 0.9, 0.3, 1.2);
            color: #48454e;
            display: inline-block;
            will-change: transform;
            position: relative;
        }
        .stars span.active {
            color: #ffd700;
            transform: scale(1.1);
        }
        .stars span:hover {
            transform: scale(1.2) rotate(-6deg);
            color: #ffd700;
        }
        .stars span:active {
            transform: scale(0.85);
        }

        .stars span.bounce {
            animation: starBounce 0.45s cubic-bezier(0.2, 0.9, 0.3, 1.2) forwards;
        }

        @keyframes starBounce {
            0% {
                transform: scale(0.5) rotate(-20deg);
            }
            50% {
                transform: scale(1.4) rotate(8deg);
            }
            70% {
                transform: scale(0.9) rotate(-4deg);
            }
            100% {
                transform: scale(1.1) rotate(0);
            }
        }

        /* ===== FORM ===== */
        .form-group {
            margin-bottom: 14px;
            transition: all 0.3s ease;
        }
        .form-group label {
            display: block;
            font-size: 13px;
            font-weight: 500;
            margin-bottom: 4px;
            color: #cac4cf;
            transition: all 0.3s;
        }
        .form-group input,
        .form-group textarea {
            width: 100%;
            padding: 11px 14px;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.06);
            background: rgba(255, 255, 255, 0.04);
            color: #e6e0e9;
            font-size: 14px;
            outline: none;
            transition: all 0.3s ease;
            font-family: inherit;
        }
        .form-group input:focus,
        .form-group textarea:focus {
            border-color: #d0bcff;
            background: rgba(255, 255, 255, 0.06);
            box-shadow: 0 0 0 3px rgba(208, 188, 255, 0.08);
        }
        .form-group textarea {
            resize: vertical;
            min-height: 70px;
        }

        /* Password field with eye */
        .password-wrap {
            position: relative;
        }
        .password-wrap input {
            padding-right: 48px;
        }
        .password-toggle {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            color: #cac4cf;
            font-size: 20px;
            cursor: pointer;
            padding: 4px 8px;
            border-radius: 8px;
            transition: all 0.2s;
            line-height: 1;
        }
        .password-toggle:hover {
            background: rgba(255, 255, 255, 0.06);
            color: #e6e0e9;
        }
        .password-toggle:active {
            transform: translateY(-50%) scale(0.9);
        }

        /* Name field animation */
        .name-field-wrap {
            overflow: hidden;
            transition: all 0.4s cubic-bezier(0.2, 0.9, 0.3, 1.1);
            max-height: 80px;
            opacity: 1;
            transform: translateY(0);
            margin-bottom: 14px;
        }
        .name-field-wrap.hidden {
            max-height: 0;
            opacity: 0;
            transform: translateY(-10px) scale(0.96);
            margin-bottom: 0;
            pointer-events: none;
        }
        .name-field-wrap .form-group {
            margin-bottom: 0;
        }

        .checkbox-wrap {
            display: flex;
            align-items: center;
            gap: 10px;
            cursor: pointer;
            padding: 4px 0;
            transition: all 0.2s;
        }
        .checkbox-wrap:hover {
            color: #e6e0e9;
        }
        .checkbox-wrap input {
            width: 18px;
            height: 18px;
            accent-color: #d0bcff;
            cursor: pointer;
            transition: transform 0.2s;
        }
        .checkbox-wrap input:checked {
            transform: scale(1.1);
        }

        /* ===== REVIEW ITEMS ===== */
        .review-item {
            background: rgba(29, 27, 32, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.04);
            border-radius: 14px;
            padding: 16px 18px;
            margin-bottom: 10px;
            animation: reviewSlideIn 0.4s cubic-bezier(0.2, 0.9, 0.3, 1.1) forwards;
            transition: all 0.3s ease;
            will-change: transform, opacity;
        }
        .review-item:hover {
            border-color: rgba(255, 255, 255, 0.08);
            background: rgba(29, 27, 32, 0.8);
        }

        .review-item.removing {
            animation: reviewSlideOut 0.3s cubic-bezier(0.2, 0.9, 0.3, 1.1) forwards;
        }

        @keyframes reviewSlideIn {
            from {
                opacity: 0;
                transform: translateY(-16px) scale(0.96);
            }
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        @keyframes reviewSlideOut {
            from {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
            to {
                opacity: 0;
                transform: translateY(-12px) scale(0.94);
            }
        }

        .review-item .top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 6px;
        }
        .review-item .name {
            font-weight: 600;
            font-size: 14px;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .review-item .name .badge-anon {
            font-size: 10px;
            font-weight: 500;
            background: rgba(255, 255, 255, 0.06);
            color: #cac4cf;
            padding: 1px 10px;
            border-radius: 20px;
        }
        .review-item .stars-display {
            color: #ffd700;
            font-size: 15px;
            letter-spacing: 1px;
        }
        .review-item .msg {
            color: #cac4cf;
            font-size: 14px;
            margin-top: 4px;
            word-break: break-word;
            line-height: 1.5;
        }
        .review-item .meta {
            color: #48454e;
            font-size: 11px;
            margin-top: 6px;
        }

        /* ===== ADMIN ===== */
        .admin-login {
            max-width: 380px;
            margin: 0 auto;
        }
        .admin-stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(100px, 1fr));
            gap: 10px;
            margin-bottom: 18px;
        }
        .admin-stats .stat {
            background: rgba(29, 27, 32, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.04);
            border-radius: 12px;
            padding: 14px;
            text-align: center;
            transition: all 0.3s;
        }
        .admin-stats .stat:hover {
            border-color: rgba(255, 255, 255, 0.08);
            transform: translateY(-2px);
        }
        .admin-stats .stat .num {
            font-size: 26px;
            font-weight: 700;
            color: #d0bcff;
        }
        .admin-stats .stat .lbl {
            font-size: 11px;
            color: #cac4cf;
        }
        .admin-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            margin-bottom: 16px;
        }

        /* ===== TOAST ===== */
        .toast {
            position: fixed;
            bottom: 24px;
            left: 50%;
            transform: translateX(-50%) translateY(20px);
            background: rgba(29, 27, 32, 0.92);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.06);
            padding: 12px 24px;
            border-radius: 14px;
            font-size: 14px;
            opacity: 0;
            pointer-events: none;
            transition: all 0.4s cubic-bezier(0.2, 0.9, 0.3, 1.1);
            z-index: 999;
            max-width: 90%;
            text-align: center;
            box-shadow: 0 16px 48px rgba(0, 0, 0, 0.5);
        }
        .toast.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }

        .empty {
            color: #48454e;
            text-align: center;
            padding: 40px 12px;
            font-size: 15px;
        }
        .text-muted {
            color: #cac4cf;
        }
        .text-center {
            text-align: center;
        }

        /* ===== RESPONSIVE ===== */
        @media (max-width: 500px) {
            body {
                padding: 10px;
            }
            .card {
                padding: 16px 14px;
            }
            .stars {
                font-size: 32px;
                gap: 4px;
            }
            .nav button {
                font-size: 11px;
                padding: 6px 8px;
            }
            .download-box .row {
                flex-direction: column;
                align-items: stretch;
            }
            .download-box .row .btn {
                justify-content: center;
            }
        }
    </style>
</head>
<body>

    <div class="container">

        <!-- ===== NAVBAR ===== -->
        <nav class="nav" id="navbar">
            <button class="active" data-page="home">🏠 Home</button>
            <button data-page="rating">⭐ Rating</button>
            <button data-page="reviews">📝 Reviews</button>
            <button data-page="admin">🔐 Admin</button>
        </nav>

        <!-- ===== PAGE: HOME ===== -->
        <div id="page-home" class="page active">
            <div class="card">
                <h1 class="card-title">📚 SekolahMu</h1>
                <p style="color:#cac4cf;font-size:15px;margin-bottom:16px;">Aplikasi SMM untuk Android</p>

                <div class="download-box">
                    <div class="row">
                        <div class="info">
                            <strong style="font-size:17px;">📱 Download APK</strong>
                            <div class="ver">Versi: <span id="apkVersion">2.2.0</span></div>
                            <div class="sz">Ukuran: <span id="apkSize">3.78 MB</span></div>
                        </div>
                        <a id="downloadBtn" href="#" class="btn btn-primary">⬇ Download</a>
                    </div>
                </div>

                <div class="coming">
                    <span class="icon">🖥</span>
                    <strong>SekolahMu untuk Windows</strong>
                    <div style="color:#cac4cf;font-size:14px;margin-top:4px;">Sedang dalam proses pembuatan</div>
                    <div style="color:#48454e;font-size:13px;margin-top:2px;">🚧 Coming Soon</div>
                </div>
            </div>
        </div>

        <!-- ===== PAGE: RATING ===== -->
        <div id="page-rating" class="page">
            <div class="card">
                <h2 class="card-title">⭐ Beri Penilaian</h2>
                <p style="color:#cac4cf;font-size:14px;margin-bottom:16px;">Bagaimana pengalaman kamu menggunakan SekolahMu?</p>

                <div class="form-group">
                    <label>Rating</label>
                    <div class="stars" id="starSelector">
                        <span data-value="1">☆</span>
                        <span data-value="2">☆</span>
                        <span data-value="3">☆</span>
                        <span data-value="4">☆</span>
                        <span data-value="5">☆</span>
                    </div>
                </div>

                <!-- Name field - animates hide/show -->
                <div class="name-field-wrap" id="nameFieldWrap">
                    <div class="form-group">
                        <label id="nameLabel">Nama</label>
                        <input type="text" id="reviewName" placeholder="Masukkan nama kamu..." maxlength="50" />
                    </div>
                </div>

                <div class="form-group">
                    <label class="checkbox-wrap">
                        <input type="checkbox" id="reviewAnonymous" />
                        <span>Kirim sebagai anonim</span>
                    </label>
                </div>

                <div class="form-group">
                    <label>Pesan</label>
                    <textarea id="reviewMessage" placeholder="Tulis pengalaman kamu..." maxlength="500"></textarea>
                </div>

                <button id="submitReview" class="btn btn-primary btn-block">📤 Kirim Review</button>
                <div id="reviewStatus" style="margin-top:10px;font-size:14px;color:#cac4cf;text-align:center;"></div>
            </div>
        </div>

        <!-- ===== PAGE: REVIEWS ===== -->
        <div id="page-reviews" class="page">
            <div class="card">
                <h2 class="card-title">📝 Review Pengguna</h2>
                <div id="reviewsStats" style="margin-bottom:16px;"></div>
                <div id="reviewsList"></div>
            </div>
        </div>

        <!-- ===== PAGE: ADMIN ===== -->
        <div id="page-admin" class="page">
            <div class="card">
                <div id="adminContent"></div>
            </div>
        </div>

    </div>

    <!-- ===== TOAST ===== -->
    <div id="toast" class="toast"></div>

    <script type="module">
        // ============================================================
        // FIREBASE
        // ============================================================
        import { initializeApp } from "firebase/app";
        import {
            getDatabase,
            ref,
            push,
            onValue,
            remove,
            get,
            set
        } from "firebase/database";
        import {
            getAuth,
            signInWithEmailAndPassword,
            onAuthStateChanged,
            signOut
        } from "firebase/auth";

        const firebaseConfig = {
            apiKey: "AIzaSyDFlncNW9nm0wyyjlaI2VfeSuzsu-lo9tA",
            authDomain: "sekolahmu-status.firebaseapp.com",
            databaseURL: "https://sekolahmu-status-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "sekolahmu-status",
            storageBucket: "sekolahmu-status.firebasestorage.app",
            messagingSenderId: "947219134844",
            appId: "1:947219134844:web:f626e88676a12108458cf9"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        const auth = getAuth(app);

        const ADMIN_UID = "3JIwxiDLKoOp8T1LIuaCpB0fqYA2";

        // ============================================================
        // STATE
        // ============================================================
        let selectedRating = 0;
        let currentUser = null;
        let isAdmin = false;
        let allReviews = [];
        let updateData = {};
        let isSubmitting = false;

        // ============================================================
        // DOM HELPERS
        // ============================================================
        const $ = (sel) => document.querySelector(sel);
        const $$ = (sel) => document.querySelectorAll(sel);

        function showToast(msg, isError = false) {
            const el = $('#toast');
            el.textContent = msg;
            el.style.borderColor = isError ? 'rgba(242,184,181,0.2)' : 'rgba(255,255,255,0.06)';
            el.classList.add('show');
            clearTimeout(el._timer);
            el._timer = setTimeout(() => el.classList.remove('show'), 3200);
        }

        // ============================================================
        // NAVIGATION
        // ============================================================
        $$('.nav button').forEach(btn => {
            btn.addEventListener('click', () => {
                $$('.nav button').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                const page = btn.dataset.page;
                $$('.page').forEach(c => c.classList.remove('active'));
                const target = $(`#page-${page}`);
                if (target) {
                    target.classList.remove('active');
                    void target.offsetHeight;
                    target.classList.add('active');
                }
                if (page === 'reviews') renderReviews();
                if (page === 'admin') renderAdmin();
            });
        });

        // ============================================================
        // STARS with Animation
        // ============================================================
        const starEls = $$('#starSelector span');
        starEls.forEach(el => {
            el.addEventListener('click', () => {
                const val = parseInt(el.dataset.value);
                if (selectedRating === val) {
                    selectedRating = 0;
                    starEls.forEach(s => {
                        s.classList.remove('active', 'bounce');
                        s.textContent = '☆';
                    });
                    return;
                }
                selectedRating = val;
                starEls.forEach(s => {
                    const sv = parseInt(s.dataset.value);
                    const active = sv <= val;
                    s.classList.toggle('active', active);
                    s.textContent = active ? '★' : '☆';
                    if (active) {
                        s.classList.remove('bounce');
                        setTimeout(() => {
                            s.classList.add('bounce');
                        }, (val - sv) * 30);
                    } else {
                        s.classList.remove('bounce');
                    }
                });
            });

            el.addEventListener('mouseenter', () => {
                const val = parseInt(el.dataset.value);
                starEls.forEach(s => {
                    const sv = parseInt(s.dataset.value);
                    if (sv <= val && !s.classList.contains('active')) {
                        s.style.color = '#ffd700';
                        s.style.transform = 'scale(1.1)';
                    }
                });
            });
            el.addEventListener('mouseleave', () => {
                starEls.forEach(s => {
                    s.style.color = '';
                    if (!s.classList.contains('active')) {
                        s.style.transform = '';
                    }
                });
            });
        });

        // ============================================================
        // ANONYM TOGGLE - Name field hide/show
        // ============================================================
        const anonCheckbox = $('#reviewAnonymous');
        const nameFieldWrap = $('#nameFieldWrap');
        const nameInput = $('#reviewName');

        anonCheckbox.addEventListener('change', () => {
            if (anonCheckbox.checked) {
                nameFieldWrap.classList.add('hidden');
                nameInput.value = '';
            } else {
                nameFieldWrap.classList.remove('hidden');
                setTimeout(() => nameInput.focus(), 350);
            }
        });

        // ============================================================
        // LOAD UPDATE DATA
        // ============================================================
        function loadUpdateData() {
            const updRef = ref(db, 'update');
            onValue(updRef, (snap) => {
                const data = snap.val();
                if (data) {
                    updateData = data;
                    $('#apkVersion').textContent = data.latestVersion || '2.2.0';
                    $('#apkSize').textContent = data.size || '3.78 MB';
                    const url = data.apkUrl ||
                        'https://github.com/V4RRXD/Sekolahmu/releases/download/v2.2.0/Sekolahmu.apk';
                    $('#downloadBtn').href = url;
                }
            });
        }
        loadUpdateData();

        // ============================================================
        // SUBMIT REVIEW
        // ============================================================
        $('#submitReview').addEventListener('click', async () => {
            if (isSubmitting) return;

            const name = anonCheckbox.checked ? '' : nameInput.value.trim() || 'Pengguna';
            const message = $('#reviewMessage').value.trim();
            const anonymous = anonCheckbox.checked;
            const rating = selectedRating;

            if (rating === 0) {
                showToast('❌ Pilih rating dulu!', true);
                const container = $('#starSelector');
                container.style.animation = 'none';
                void container.offsetHeight;
                container.style.animation = 'shake 0.4s ease';
                setTimeout(() => container.style.animation = '', 500);
                return;
            }
            if (!message) {
                showToast('❌ Tulis pesan review!', true);
                $('#reviewMessage').focus();
                $('#reviewMessage').style.borderColor = '#f2b8b5';
                setTimeout(() => $('#reviewMessage').style.borderColor = '', 2000);
                return;
            }

            isSubmitting = true;
            const statusEl = $('#reviewStatus');
            statusEl.textContent = '⏳ Mengirim...';
            statusEl.style.color = '#cac4cf';
            $('#submitReview').disabled = true;

            try {
                const reviewsRef = ref(db, 'reviews');
                const newRef = push(reviewsRef);
                await set(newRef, {
                    name: anonymous ? '' : name,
                    anonymous: anonymous,
                    rating: rating,
                    message: message,
                    appVersion: updateData.latestVersion || '2.2.0',
                    timestamp: Date.now()
                });

                statusEl.textContent = '✅ Terima kasih! Review berhasil dikirim. 🎉';
                statusEl.style.color = '#a8e6cf';
                showToast('✅ Review berhasil dikirim!');

                selectedRating = 0;
                starEls.forEach(s => {
                    s.classList.remove('active', 'bounce');
                    s.textContent = '☆';
                });
                nameInput.value = '';
                $('#reviewMessage').value = '';
                anonCheckbox.checked = false;
                nameFieldWrap.classList.remove('hidden');

                loadReviews();

            } catch (err) {
                statusEl.textContent = '❌ Gagal mengirim: ' + err.message;
                statusEl.style.color = '#f2b8b5';
                showToast('❌ Gagal mengirim review', true);
            }

            isSubmitting = false;
            $('#submitReview').disabled = false;
            setTimeout(() => {
                statusEl.style.color = '#cac4cf';
            }, 4000);
        });

        // ============================================================
        // LOAD & RENDER REVIEWS
        // ============================================================
        function loadReviews() {
            const reviewsRef = ref(db, 'reviews');
            onValue(reviewsRef, (snap) => {
                const data = snap.val();
                allReviews = [];
                if (data) {
                    Object.keys(data).forEach(key => {
                        const item = data[key];
                        if (item && typeof item === 'object' && item.rating !== undefined) {
                            allReviews.push({
                                id: key,
                                ...item
                            });
                        }
                    });
                }
                allReviews.sort((a, b) => (b.timestamp || 0) - (a.timestamp || 0));
                renderReviews();
            });
        }

        function renderReviews() {
            const list = $('#reviewsList');
            const stats = $('#reviewsStats');

            if (allReviews.length === 0) {
                list.innerHTML = `
                        <div class="empty">
                            <div style="font-size:48px;margin-bottom:12px;">📝</div>
                            Belum ada review.<br />
                            <span style="color:#cac4cf;font-size:13px;">Jadilah yang pertama! 🎉</span>
                        </div>
                    `;
                stats.innerHTML = '';
                return;
            }

            const total = allReviews.length;
            const avg = allReviews.reduce((sum, r) => sum + r.rating, 0) / total;
            const starsCount = [0, 0, 0, 0, 0];
            allReviews.forEach(r => {
                if (r.rating >= 1 && r.rating <= 5) starsCount[r.rating - 1]++;
            });

            stats.innerHTML = `
                    <div style="display:flex;gap:16px;flex-wrap:wrap;background:rgba(29,27,32,0.4);padding:14px 18px;border-radius:12px;border:1px solid rgba(255,255,255,0.04);">
                        <div style="display:flex;align-items:center;gap:8px;">
                            <span style="font-size:28px;font-weight:700;color:#ffd700;">${avg.toFixed(1)}</span>
                            <span style="color:#ffd700;font-size:20px;">⭐</span>
                            <span style="color:#cac4cf;font-size:13px;">(${total} review)</span>
                        </div>
                        <div style="display:flex;gap:6px;flex-wrap:wrap;font-size:12px;align-items:center;">
                            ${[5,4,3,2,1].map(n => `
                                    <span style="background:rgba(255,255,255,0.04);padding:2px 10px;border-radius:20px;display:flex;align-items:center;gap:4px;">
                                        <span style="color:#ffd700;">${'★'.repeat(n)}</span>
                                        <span style="color:#cac4cf;">${starsCount[n-1]}</span>
                                    </span>
                                `).join('')}
                        </div>
                    </div>
                `;

            list.innerHTML = allReviews.map((r, index) => {
                const displayName = r.anonymous ? 'Anonymous' : (r.name || 'Pengguna');
                const starsStr = '★'.repeat(r.rating) + '☆'.repeat(5 - r.rating);
                const date = r.timestamp ? new Date(r.timestamp).toLocaleDateString('id-ID', {
                    day: 'numeric',
                    month: 'short',
                    year: 'numeric'
                }) : '';
                const version = r.appVersion ? `v${r.appVersion}` : '';

                let adminBtn = '';
                if (isAdmin) {
                    adminBtn = `
                            <button class="btn btn-danger btn-sm delete-review" data-id="${r.id}" style="margin-top:6px;">
                                🗑 Hapus
                            </button>
                        `;
                }

                const delay = Math.min(index * 40, 400);

                return `
                        <div class="review-item" data-id="${r.id}" style="animation-delay:${delay}ms;">
                            <div class="top">
                                <span class="name">
                                    ${displayName}
                                    ${r.anonymous ? '<span class="badge-anon">anonim</span>' : ''}
                                </span>
                                <span class="stars-display">${starsStr}</span>
                            </div>
                            <div class="msg">${r.message}</div>
                            <div class="meta">${date} ${version ? '• ' + version : ''}</div>
                            ${adminBtn}
                        </div>
                    `;
            }).join('');

            $$('.delete-review').forEach(btn => {
                btn.addEventListener('click', async () => {
                    const id = btn.dataset.id;
                    if (!confirm('Hapus review ini secara permanen?')) return;

                    const item = btn.closest('.review-item');
                    item.classList.add('removing');

                    try {
                        await remove(ref(db, `reviews/${id}`));
                        showToast('✅ Review dihapus');
                    } catch (err) {
                        showToast('❌ Gagal hapus: ' + err.message, true);
                        item.classList.remove('removing');
                    }
                });
            });
        }

        // ============================================================
        // ADMIN AUTH
        // ============================================================
        function renderAdmin() {
            const container = $('#adminContent');
            if (!currentUser) {
                container.innerHTML = `
                        <div style="animation:pageFadeIn 0.4s ease forwards;">
                            <h2 class="card-title">🔐 Admin Login</h2>
                            <div class="admin-login">
                                <div class="form-group">
                                    <label>Email</label>
                                    <input type="email" id="adminEmail" placeholder="Email" />
                                </div>
                                <div class="form-group">
                                    <label>Password</label>
                                    <div class="password-wrap">
                                        <input type="password" id="adminPassword" placeholder="Password" />
                                        <button type="button" class="password-toggle" id="togglePassword" aria-label="Toggle password visibility">
                                            👁
                                        </button>
                                    </div>
                                </div>
                                <button id="adminLoginBtn" class="btn btn-primary btn-block">🔑 Login</button>
                                <div id="adminLoginStatus" style="margin-top:10px;font-size:14px;color:#cac4cf;text-align:center;"></div>
                            </div>
                        </div>
                    `;

                // Password toggle
                const toggleBtn = $('#togglePassword');
                const passInput = $('#adminPassword');
                let passwordVisible = false;

                toggleBtn.addEventListener('click', () => {
                    passwordVisible = !passwordVisible;
                    passInput.type = passwordVisible ? 'text' : 'password';
                    toggleBtn.textContent = passwordVisible ? '🙈' : '👁';
                });

                $('#adminLoginBtn').addEventListener('click', async () => {
                    const email = $('#adminEmail').value.trim();
                    const pass = $('#adminPassword').value.trim();
                    const status = $('#adminLoginStatus');
                    if (!email || !pass) {
                        status.textContent = '❌ Isi email dan password';
                        status.style.color = '#f2b8b5';
                        return;
                    }
                    status.textContent = '⏳ Login...';
                    status.style.color = '#cac4cf';
                    $('#adminLoginBtn').disabled = true;
                    try {
                        await signInWithEmailAndPassword(auth, email, pass);
                        status.textContent = '✅ Login berhasil!';
                        status.style.color = '#a8e6cf';
                        showToast('✅ Login berhasil');
                    } catch (err) {
                        status.textContent = '❌ ' + err.message;
                        status.style.color = '#f2b8b5';
                        showToast('❌ Login gagal', true);
                    }
                    $('#adminLoginBtn').disabled = false;
                });

                $('#adminPassword').addEventListener('keydown', (e) => {
                    if (e.key === 'Enter') $('#adminLoginBtn').click();
                });
                $('#adminEmail').addEventListener('keydown', (e) => {
                    if (e.key === 'Enter') $('#adminPassword').focus();
                });

                return;
            }

            if (!isAdmin) {
                container.innerHTML = `
                        <div style="text-align:center;padding:30px 0;animation:pageFadeIn 0.4s ease forwards;">
                            <div style="font-size:48px;margin-bottom:12px;">⛔</div>
                            <h2 style="margin-bottom:6px;">Bukan Admin</h2>
                            <p style="color:#cac4cf;">Akun ini tidak memiliki akses admin.</p>
                            <button id="adminLogoutBtn" class="btn btn-outline" style="margin-top:16px;">🚪 Logout</button>
                        </div>
                    `;
                $('#adminLogoutBtn')?.addEventListener('click', () => signOut(auth));
                return;
            }

            const total = allReviews.length;
            const avg = total > 0 ? (allReviews.reduce((s, r) => s + r.rating, 0) / total) : 0;

            container.innerHTML = `
                    <div style="animation:pageFadeIn 0.4s ease forwards;">
                        <div class="admin-header">
                            <h2 class="card-title">🛡 Admin Dashboard</h2>
                            <button id="adminLogoutBtn" class="btn btn-outline btn-sm">🚪 Logout</button>
                        </div>
                        <div class="admin-stats">
                            <div class="stat"><div class="num">${total}</div><div class="lbl">Total Review</div></div>
                            <div class="stat"><div class="num">${avg.toFixed(1)}</div><div class="lbl">⭐ Rating</div></div>
                            <div class="stat"><div class="num">${updateData.latestVersion || '2.2.0'}</div><div class="lbl">APK Version</div></div>
                        </div>
                        <div id="adminReviewsList"></div>
                    </div>
                `;

            $('#adminLogoutBtn').addEventListener('click', () => signOut(auth));

            const adminList = $('#adminReviewsList');
            if (allReviews.length === 0) {
                adminList.innerHTML = `<div class="empty">Belum ada review.</div>`;
                return;
            }

            adminList.innerHTML = allReviews.map((r, index) => {
                const displayName = r.anonymous ? 'Anonymous' : (r.name || 'Pengguna');
                const starsStr = '★'.repeat(r.rating) + '☆'.repeat(5 - r.rating);
                const date = r.timestamp ? new Date(r.timestamp).toLocaleDateString('id-ID') : '';
                const delay = Math.min(index * 30, 300);
                return `
                        <div class="review-item" style="animation-delay:${delay}ms;">
                            <div class="top">
                                <span class="name">
                                    ${displayName}
                                    ${r.anonymous ? '<span class="badge-anon">anonim</span>' : ''}
                                </span>
                                <span class="stars-display">${starsStr}</span>
                            </div>
                            <div class="msg">${r.message}</div>
                            <div class="meta">${date}</div>
                            <button class="btn btn-danger btn-sm admin-delete" data-id="${r.id}" style="margin-top:6px;">
                                🗑 Hapus
                            </button>
                        </div>
                    `;
            }).join('');

            $$('.admin-delete').forEach(btn => {
                btn.addEventListener('click', async () => {
                    const id = btn.dataset.id;
                    if (!confirm('Hapus review ini?')) return;

                    const item = btn.closest('.review-item');
                    item.classList.add('removing');

                    try {
                        await remove(ref(db, `reviews/${id}`));
                        showToast('✅ Review dihapus');
                    } catch (err) {
                        showToast('❌ Gagal hapus: ' + err.message, true);
                        item.classList.remove('removing');
                    }
                });
            });
        }

        // ============================================================
        // AUTH STATE
        // ============================================================
        onAuthStateChanged(auth, (user) => {
            currentUser = user;
            if (user) {
                isAdmin = (user.uid === ADMIN_UID);
                get(ref(db, `admins/${user.uid}`)).then(snap => {
                    const data = snap.val();
                    if (data && data.role === 'admin') {
                        isAdmin = true;
                    }
                    renderAdmin();
                }).catch(() => {
                    renderAdmin();
                });
            } else {
                isAdmin = false;
                renderAdmin();
            }
        });

        // ============================================================
        // SHAKE ANIMATION
        // ============================================================
        const styleShake = document.createElement('style');
        styleShake.textContent = `
                @keyframes shake {
                    0%, 100% { transform: translateX(0); }
                    20% { transform: translateX(-12px); }
                    40% { transform: translateX(12px); }
                    60% { transform: translateX(-8px); }
                    80% { transform: translateX(8px); }
                }
            `;
        document.head.appendChild(styleShake);

        // ============================================================
        // INIT
        // ============================================================
        loadReviews();

        console.log('✅ SekolahMu App loaded');
        console.log('Admin UID:', ADMIN_UID);
    </script>

</body>
</html>
